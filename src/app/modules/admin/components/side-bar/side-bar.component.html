<div class="bg-cyan-700 h-[91vh] w-96 shadow-md shadow-black flex flex-col justify-between py-12">
    <p class="text-5xl text-white text-center m-10">logo</p>
  
    <ul>
      <li *ngFor="let i of sideBarItems">
        <a [routerLink]="i.link" class="flex justify-start items-center text-3xl text-white rounded-full m-2 px-8 py-6 cursor-pointer hover:bg-cyan-950 duration-100">
          <i class="{{ i.logo }} px-3"></i>
          <span>{{ i.item }}</span>
        </a>
      </li>
    </ul>
  
    <a [routerLink]="'/home'" 
      class="h-16 w-44 m-10 shadow-black shadow-lg rounded-full bg-white text-cyan-950 font-semibold text-2xl hover:scale-105 duration-300 flex items-center justify-center">
      LOG OUT</a>
</div>
