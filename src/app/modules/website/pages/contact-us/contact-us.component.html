<div class="flex justify-center items-center h-80 bg-cyan-700 ">
  <p class="text-sky-50 font-bold text-[40px]">Contact Us</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 place-items-center gap-4 m-4">
  <div class="bg-cyan-700 py-10 md:py-20 px-10 md:px-16 border-gray-700 border rounded-2xl w-[30rem] h-[40rem] md:w-[35rem] md:h-[40rem] shadow-xl lg:w-[45rem] lg:h-[50rem]">
      <p class="text-4xl font-bold text-white" >Contact us...</p>    
      <p class="text-2xl text-gray-200 my-10">We are here to help and answer any questions you might have.</p>
    <div>
     <ul *ngFor="let i of contactDetales" class="text-2xl text-white ">
        <li [ngClass]="i.icon" class=" my-8">{{i.item}} </li>
      </ul>
    </div> 
  </div>

  <div class="bg-cyan-700 py-10 md:py-20 px-10 md:px-16 border-gray-700 border rounded-2xl w-[30rem] h-[40rem] md:w-[35rem] md:h-[40rem] shadow-xl lg:w-[45rem] lg:h-[50rem]">
    <p class="pt-4 px-4 text-4xl font-bold text-white">Send us a message...</p>

    <div class="mt-8 m-2 text-2xl text-white">Name</div>
    <input type="text" [(ngModel)]="name" class="border-gray-700 border rounded-lg h-12 w-3/4 p-2" />

    <div class="m-2 text-2xl text-white">Gmail</div>
    <input type="email" [(ngModel)]="email" class="border-gray-700 border rounded-lg h-12 w-5/6 p-2" />

    <div class="mt-6 m-2 text-2xl text-white  ">Message</div>
    <textarea [(ngModel)]="message" class="w-5/6 border-gray-700 border rounded-lg h-40 p-2" placeholder="Enter your message..."></textarea>

    <button (click)="submitForm()" class="w-52 h-12 lg:h-16 lg:m-6 bg-cyan-950 border border-gray-500 rounded-lg text-white text-2xl hover:bg-blue-600 hover:scale-105 duration-300">
      Submit
    </button>
  </div>
</div>
