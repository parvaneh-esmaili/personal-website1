<div class="flex justify-center items-center h-80 bg-cyan-700">
  <p class="text-sky-50 font-bold text-[40px]">Contact Us</p>
</div>



<div class="flex justify-around items-center h-full">
  <div class="bg-cyan-700 p-14 border-gray-700 border-2 rounded-2xl w-[550px] h-[600px] shadow-xl">
    <div class="text-white pt-40 px-10 text-xl">
      <p class="text-2xl">How can we help you?</p>
    </div>
    <div class="text-5xl font-bold p-10 text-white">
      <p>Contact us</p>
    </div>
    <div class="text-2xl p-10 text-gray-200">
      <p>We are here to help and answer any questions you might have.</p>
    </div>
    <div>
     <ul *ngFor="let i of contactDetales" class="text-2xl text-white ">
        <li [ngClass]="i.icon" class="mx-14 my-8">{{i.item}} </li>
      </ul>
    </div> 
  </div>

  <div class="bg-cyan-700 p-14 border-gray-700 border-2 rounded-2xl w-[550px] h-[600px] flex flex-col shadow-xl">
    <p class="text-center font-bold text-white text-4xl mt-32">Send us a message...</p>

    <div class="mt-8 m-2 text-2xl text-white">Name</div>
    <input type="text" [(ngModel)]="name" class="border-gray-700 border rounded-lg h-12 p-2" />

    <div class="m-2 text-2xl text-white">Gmail</div>
    <input type="email" [(ngModel)]="email" class="border-gray-700 border rounded-lg h-12 p-2" />

    <div class="mt-6 m-2 text-2xl text-white">Message</div>
    <textarea [(ngModel)]="message" class="border-gray-700 border rounded-lg h-40 p-2" placeholder="Enter your message..."></textarea>

    <button (click)="submitForm()" class="w-72 h-16 bg-cyan-950 border border-gray-500 rounded-3xl my-11 text-white text-2xl hover:bg-blue-600">
      Submit
    </button>
  </div>
</div>
